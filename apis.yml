aid: ablesky
name: AbleSky
description: 'AbleSky, Inc. (能力天空) is an online-education SaaS company incorporated
  in 2007 in Mountain View, California, operating in China through
  its wholly owned subsidiary 能力天空科技（北京）有限公司 in Beijing. Its platform lets a
  school, training institution or instructor stand up a branded online school
  — website, Android and iOS apps, WeChat micro-school and official account — with
  course hosting, live classes, exams, educational-administration workflow, course
  distribution and learner payment collection, marketed as roughly 3,000 features to
  training organisations across more than 2,000 Chinese cities. It also sells an independent deployment onto a customer''s own cloud or
  hardware. It publishes NO public API: contract discovery on 2026-09-06 found no
  OpenAPI, AsyncAPI, GraphQL SDL, WSDL, gRPC service, MCP server, agent card, SDK or
  developer portal on any AbleSky host. The one machine-readable document it does
  publish is a valid, auto-discoverable OpenSearch 1.1 course-search descriptor.'
