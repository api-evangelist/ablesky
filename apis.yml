    all HTTP 404 on www.ablesky.com; open., developer., docs. and openapi.ablesky.com
    do not answer; api.ablesky.com blanket-403s every path from nginx/1.6.0.'
  graphql: 'miss — https://www.ablesky.com/graphql HTTP 404.'
  mcp: 'miss — no hosted or local MCP server published, and no OpenAPI to derive a
    candidate tool list from.'
  agent_card: 'miss — /.well-known/agent-card.json and /.well-known/agent.json probed
    on eleven hosts; every real answer 404. 1.ablesky.com returns HTTP 200 with a
    31,546-byte HTML SPA shell for every /.well-known/ path and was rejected as the
    known soft-200 false positive. No a2a/ artifact was written.'
  wsdl: 'miss — no ?wsdl / ?singleWsdl surface, no SOAP or enterprise integration
    section in the docs, nothing in the GitHub organization.'
  grpc: 'miss — no .proto in github.com/ablesky (3 public repos, all internal tooling)
    and no buf.build presence.'
  ogc: 'not applicable — AbleSky is an education SaaS provider; no baseURL, docs link
    or prose points at a WMS/WFS/WCS/WMTS/CSW or OGC API surface, so no blind probing
    was done.'
  hit: 'OpenSearch 1.1 description at https://www.ablesky.com/s/opensearch.xml (HTTP
    200), auto-discoverable from the homepage via <link rel="search"
    type="application/opensearchdescription+xml">. Its only Url template is
    type="text/html", so it describes a human-facing course-search page, not a data
    API — which is why no apis[] entry was created from it. Saved verbatim to
    conformance/ablesky-opensearch.xml.'
  rejected_on_ownership: 'github.com/itwenqiang/open_api_ablesky — a personal Vue.js
    admin console whose base URL is a private RFC 1918 address (192.168.202.190:8081)
    and whose /openApi/* calls are merchant and shop onboarding, not online education.
    Not served by any host AbleSky controls and not in the AbleSky organization; no
    artifact was derived from it.'
